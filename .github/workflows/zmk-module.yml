name: Test ZMK Module

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/devcontainer.yml
      - .github/workflows/claude.yml
      - .github/workflows/codex.yml
      - .github/workflows/web-ui.yml
      - .github/actions/zmk-env/**
      - .gitignore
      - .claude/**
      - "web/**"
      - "tests/web/**"
      - "tests/run-web.sh"
  pull_request:
  workflow_dispatch:
  schedule:
    # 20:00 JST every Friday (11:00 UTC)
    - cron: "0 11 * * 5"

jobs:
  test-static-checks:
    name: Owner test static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Install pinned checker
        run: python -m pip install pre-commit==4.7.0
      - name: Check owned tests and tools
        env:
          # Firmware and Web jobs execute these exact owner entry points.
          SKIP: eslint,jest,web-build,zmk-module-test
        run: git ls-files -z -- tests tools | xargs -0 -r pre-commit run --verbose --files

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/west-init
      - name: Test
        run: OWNER_TEST_OUTPUT="$PWD/owner-test-output" python3 -m unittest discover -v -s tests -p test_owner.py
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware
          include-hidden-files: true
          path: |
            owner-test-output/**/*.uf2
            owner-test-output/**/*.elf
            !owner-test-output/**/zephyr_pre*.elf
            owner-test-output/**/*.exe
            owner-test-output/**/*.log
            owner-test-output/**/*.diff
            owner-test-output/**/*.json
            owner-test-output/**/*.dts
            owner-test-output/**/.config
            owner-test-output/**/CMakeCache.txt
            owner-test-output/**/zephyr_modules.txt

  renode-relay-test:
    runs-on: ubuntu-latest
    # Two real images booted on one Renode session + the Renode install.
    timeout-minutes: 20
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    name: Renode custom-settings wired-split relay test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/west-init
      - name: Build usb+wired split halves
        # The Studio central + the relay-enabled peripheral; see
        # tests/zmk-config/build-usb-split.yaml.
        run: >-
          west zmk-build tests/zmk-config
          --build-yaml tests/zmk-config/build-usb-split.yaml -af usb-wired-central &&
          west zmk-build tests/zmk-config
          --build-yaml tests/zmk-config/build-usb-split.yaml -af usb-wired-peripheral
      - name: Run split-relay round-trip test
        # zmk-west-commands' composite action: caches/installs Renode + the
        # python protobuf/protoc deps, then runs the generic usb+wired smoke
        # (GetDeviceInfo over USB + a peripheral keypress relayed to the central)
        # followed by this module's own tests/renode/*_test.py -- the host reads
        # AND writes the split PERIPHERAL's settings over the wired split relay.
        uses: cormoran/zmk-west-commands/.github/actions/zmk-renode-test@main
        with:
          mode: wired-split
          elf-path: build/usb-wired-central/zephyr/zmk.elf
          peripheral-elf: build/usb-wired-peripheral/zephyr/zmk.elf
          tests: tests/renode

  keepalive:
    if: github.event_name == 'schedule'
    # Re-enabling a workflow needs actions: write; the checkout reads the repository.
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Re-enable workflow to avoid deactivating scheduled runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_REPO: ${{ github.repository }}
        run: |
          gh workflow enable zmk-module.yml
